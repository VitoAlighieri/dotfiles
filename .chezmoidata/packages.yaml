# =====================================================================
# Paquetes gestionados por chezmoi
# ---------------------------------------------------------------------
#   - windows.winget / windows.nerdfonts -> solo Windows
#   - vscode.extensions                  -> en cualquier maquina con VS Code
#
# La lista de winget la consume el script de preinstalacion:
#   .chezmoiscripts/run_onchange_before_10-install-packages.ps1.tmpl
#
# Que hace ese script en CADA equipo, al ejecutar `chezmoi apply`:
#   - Si el paquete NO esta instalado            -> winget install
#   - Si esta instalado y hay version mas nueva  -> winget upgrade
#   (se vuelve a ejecutar cuando editas este archivo y, ademas,
#    una vez al dia para comprobar actualizaciones)
#
# Para anadir un programa: descomenta o copia una linea con su Id de
# winget exacto. Busca el Id con:  winget search <nombre>
# Opcional por paquete:  upgrade: false  (no lo actualiza winget, p. ej.
# porque el programa ya se actualiza solo).
# =====================================================================
packages:
  windows:
    # --- Programas a asegurar via winget (id = Id EXACTO de winget) ---
    winget:
      - id: Neovim.Neovim          # Editor        (config en dot_config/nvim, comun)
      - id: Starship.Starship      # Prompt        (dot_config/starship.toml, comun)
      - id: lsd-rs.lsd             # ls moderno    (dot_config/lsd, comun)
      - id: sharkdp.bat            # cat a color   (dot_config/bat, comun)
      - id: sharkdp.fd             # busqueda de archivos   (usa ~/.config, comun)
      - id: tldr-pages.tlrc             # collaborative cheatsheets for console commands
      - id: BurntSushi.ripgrep.MSVC   # grep rapido (dot_config/ripgrep, comun)
      - id: Microsoft.Coreutils    # 75+ comandos Unix nativos (wc, cut, head, sha256sum...)
                                   #   Tus alias (ls->lsd, cat->bat, grep->rg, find->fd)
                                   #   tienen prioridad y se respetan.
      - id: Git.Git                # git           (lo necesita lazy.nvim y el prompt)
      - id: Microsoft.PowerShell   # PowerShell 7  (solo Windows; dot_config/powershell)
      - id: Flow-Launcher.Flow-Launcher  # Lanzador  (solo Windows; AppData/Roaming/FlowLauncher)
      - id: Microsoft.VisualStudioCode   # VS Code   (se instala solo en Windows;
        upgrade: false                   #            settings comunes en dot_config/Code).
                                         #   upgrade: false -> se actualiza solo; el
                                         #   `winget upgrade` diario fallaria si esta abierto.

      # --- Opcionales: descomenta lo que quieras que se instale --------
      # Dependencias reales de tu Neovim (telescope / Snacks):
      # - id: dandavison.delta          # diffs bonitos (previewer de Snacks)
      #
      # Toolchains para los LSP / linter / treesitter de Neovim:
      # - id: OpenJS.NodeJS.LTS         # ts_ls, eslint, cssls, tailwind, bashls, pyright
      # - id: Python.Python.3.13        # desarrollo Python
      # - id: Microsoft.DotNet.SDK.9    # omnisharp (C#)
      # - id: zig.zig                   # zls + compilador C para treesitter
      # - id: LLVM.LLVM                 # clang (compilador C alternativo treesitter/ccls)
      #
      # Monitor de sistema (alias `htop` del profile):
      # - id: Abdenasser.NeoHtop        # ajusta el Id si tu `neohtop-cli` es otro

    # --- Nerd Fonts a instalar (desde el release oficial nerd-fonts) --
    # Necesarias para que los iconos de starship/lsd/neovim se vean bien.
    # El nombre debe coincidir con el .zip del release (p.ej. JetBrainsMono,
    # FiraCode, CascadiaCode, Hack...). https://github.com/ryanoasis/nerd-fonts
    nerdfonts:
      - JetBrainsMono

  # --- Extensiones de VS Code (en cualquier SO donde haya VS Code) -------
  # Las instalan los scripts run_onchange_after_50-vscode-extensions.*
  # si faltan. Id = publisher.nombre (lo ves en el Marketplace o con
  # `code --list-extensions`).
  vscode:
    extensions:
      - Catppuccin.catppuccin-vsc        # tema Catppuccin (Macchiato en settings.json)
      - Catppuccin.catppuccin-vsc-icons  # iconos Catppuccin

      # --- Opcionales: descomenta lo que quieras ------------------------
      # Equivalentes a los LSP de tu Neovim:
      # - ms-vscode.powershell                    # PowerShell
      # - sumneko.lua                             # Lua (lua_ls)
      # - ms-python.python                        # Python (pyright -> Pylance)
      # - ms-dotnettools.csharp                   # C# (omnisharp)
      # - ziglang.vscode-zig                      # Zig (zls)
      # - mads-hartmann.bash-ide-vscode           # Bash (bashls)
      # - dbaeumer.vscode-eslint                  # ESLint
      # - bradlc.vscode-tailwindcss               # Tailwind CSS
      # - llvm-vs-code-extensions.vscode-clangd   # C/C++ (clangd)
      # Otras utiles:
      # - editorconfig.editorconfig               # respeta .editorconfig
      # - vscodevim.vim                           # atajos de Vim
